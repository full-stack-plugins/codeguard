[package]
name = "codeguard-gg-candidate-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

# Deliberately separate: the mature four-crate workspace keeps MSRV1.85 and dependency rules.
[workspace]

[dependencies]
codeguard-cli = { path = "../../crates/codeguard-cli" }
codeguard-runtime = { path = "../../crates/codeguard-runtime" }
gitguard = { path = "../../../gitguard" }
guardengine = { path = "../../../guardengine" }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tempfile = "=3.23.0"
time = { version = "=0.3.44", features = ["formatting"] }

[profile.dev]
debug = 0
[profile.test]
debug = 0
[profile.dev.package.sha2]
opt-level = 3
