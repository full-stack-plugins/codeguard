[workspace]
members = [
    "crates/codeguard-cli",
    "crates/codeguard-core",
    "crates/codeguard-runtime",
    "crates/codeguard-adapters",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
sha1 = "=0.10.7"
ring = "=0.17.14"
