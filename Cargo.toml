[workspace]
members = [
    "crates/codeguard-cli",
    "crates/codeguard-core",
    "crates/codeguard-runtime",
    "crates/codeguard-adapters",
]
resolver = "2"

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
sha1 = "=0.10.7"
ring = "=0.17.14"
base64 = "=0.22.1"

# 开发与测试保留全部制品摘要核验，仅优化 SHA-256 压缩计算，避免大工具耗尽检查预算。
[profile.dev.package.sha2]
opt-level = 3
