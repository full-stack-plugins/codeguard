[package]
name = "codeguard-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
wasm-precheck = ["codeguard-runtime/wasm-precheck"]

[[bin]]
name = "codeguard"
path = "src/main.rs"

[dependencies]
codeguard-core = { path = "../codeguard-core" }
codeguard-runtime = { path = "../codeguard-runtime" }
codeguard-adapters = { path = "../codeguard-adapters" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sha1.workspace = true
ring.workspace = true
http = "=1.5.0"

[dev-dependencies]
base64.workspace = true
ring.workspace = true
tokio = { version="=1.53.1", features=["rt","time","net"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_IO"] }
