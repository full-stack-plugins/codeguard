[package]
name = "codeguard-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["full-cli"]
full-cli = ["dep:codeguard-core", "dep:codeguard-runtime", "dep:codeguard-adapters", "dep:serde", "dep:sha2", "dep:sha1", "dep:http", "dep:guard-protocol", "dep:guard-contract"]
wasm-precheck = ["full-cli", "codeguard-runtime/wasm-precheck"]

[[bin]]
name = "codeguard"
path = "src/main.rs"

[dependencies]
guard-protocol = { path = "../../../guardengine/crates/guard-protocol", optional = true }
guard-contract = { path = "../../../guardengine/crates/guard-contract", optional = true }
guard-install = { path = "../../../guardengine/crates/guard-install" }
codeguard-core = { path = "../codeguard-core", optional = true }
codeguard-runtime = { path = "../codeguard-runtime", optional = true }
codeguard-adapters = { path = "../codeguard-adapters", optional = true }
serde = { workspace = true, optional = true }
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
sha1 = { workspace = true, optional = true }
http = { version = "=1.5.0", optional = true }

[dev-dependencies]
guard-subject = { path = "../../../guardengine/crates/guard-subject" }
base64.workspace = true
ring.workspace = true
tokio = { version="=1.53.1", features=["rt","time","net"] }
