[package]
name = "codeguard-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
codeguard-core = { path = "../codeguard-core" }
libc = "0.2"
ring.workspace = true
tar = { version = "=0.4.46", default-features = false }
zip = { version = "=6.0.0", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }

reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-webpki-roots", "stream"] }
tokio = { version = "=1.53.1", features = ["rt", "time", "net", "io-util", "macros"] }
tokio-util = { version = "=0.7.19", features = ["io"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# 保持 IDNA 的传递 ICU 依赖在 Rust 1.85 基线内。
idna_adapter = "=1.2.0"

[dev-dependencies]
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
