name: CodeGuard platform candidate evidence

# Candidate evidence only: this does not publish or qualify a platform.
on:
  workflow_dispatch:
  push:
    branches: [fix/codeguard-platform-evidence-20261028]

permissions:
  contents: read

jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux_x86_64
            binary: target/debug/codeguard
            package: true
          - runner: macos-14
            target: macos_arm64
            binary: target/debug/codeguard
            package: true
          - runner: windows-2022
            target: windows_x86_64
            binary: target/debug/codeguard.exe
            package: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      CODEGUARD_BUILD_SHA: ${{ github.sha }}
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CANDIDATE_TARGET: ${{ matrix.target }}
      CANDIDATE_BINARY: ${{ matrix.binary }}
      CANDIDATE_NPM_PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Record actual runner and toolchain
        shell: bash
        run: |
          rustc -Vv
          cargo -V
          cmake --version
          node -p 'JSON.stringify({platform:process.platform,arch:process.arch})'
      - name: Build native candidate with WASM feature
        id: native_build
        shell: python
        run: |
          import pathlib, subprocess, sys
          evidence = pathlib.Path("candidate-evidence")
          evidence.mkdir(exist_ok=True)
          with (evidence / "build.log").open("wb") as log:
              result = subprocess.run(
                  ["cargo", "build", "--locked", "-p", "codeguard-cli", "--features", "wasm-precheck"],
                  stdout=log, stderr=subprocess.STDOUT, check=False)
          print("Native build log saved to candidate-evidence/build.log")
          if result.returncode != 0:
              # At most 2 KiB of original log bytes, then at most 40 lines.
              # UTF-8 replacement and workflow escaping keep the annotation
              # below 8 KiB. No environment dump or separate log URL access.
              with (evidence / "build.log").open("rb") as log:
                  log.seek(0, 2)
                  log.seek(max(0, log.tell() - 2048))
                  tail = log.read().decode("utf-8", errors="replace")
              diagnostic = "\n".join(tail.splitlines()[-40:])
              diagnostic = diagnostic.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::error title=Native candidate build failed::" + diagnostic)
          sys.exit(result.returncode)
      - name: Verify version CLI contract on actual runner
        run: cargo test --locked -p codeguard-cli --features wasm-precheck --test version_cli
      - name: Record binary identity without claiming functional acceptance
        shell: python
        run: |
          import hashlib, json, os, pathlib, platform, subprocess
          binary = pathlib.Path(os.environ["CANDIDATE_BINARY"]).resolve()
          result = subprocess.run([str(binary), "--version", "--format", "json"],
                                  capture_output=True, text=True, check=True, timeout=15)
          report = json.loads(result.stdout)
          assert report["target"] == os.environ["CANDIDATE_TARGET"], report
          assert report["build_identity"] == os.environ["CODEGUARD_BUILD_SHA"], report
          capabilities = json.loads(subprocess.run(
              [str(binary), "capabilities", "--format", "json"],
              capture_output=True, text=True, check=True, timeout=15).stdout)
          assert len(capabilities["languages"]) == 57, capabilities
          evidence = {
              "scope": "candidate identity only; not production or Codex host acceptance",
              "system": platform.platform(), "machine": platform.machine(),
              "version_report": report,
              "registered_language_count": len(capabilities["languages"]),
              "language_execution_scope": "registration preservation only; not 57-language execution acceptance",
              "binary_sha256": hashlib.sha256(binary.read_bytes()).hexdigest(),
              "npm_package_step_enabled": os.environ["CANDIDATE_NPM_PACKAGE"] == "true",
              "windows_runtime_scope": "candidate Job Object and file safety contracts; not full language or host acceptance",
          }
          pathlib.Path("candidate-evidence").mkdir(exist_ok=True)
          pathlib.Path("candidate-evidence/identity.json").write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
      - name: Require native process safety contracts on each platform
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        # Native execution is required; UnsupportedPlatform is not success.
        run: python scripts/candidate-test.py process-contract cargo test --locked -p codeguard-runtime --test process_contract_portable
      - name: Require platform filesystem safety contracts
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: python scripts/candidate-test.py filesystem-contract cargo test --locked -p codeguard-runtime --test platform_fs_contract
      - name: Require native CLI adapter path contracts
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: python scripts/candidate-test.py cli-platform-contract cargo test --locked -p codeguard-cli --features wasm-precheck --test platform_adapter_contract --test task_lease_contract
      - name: Require Windows process cleanup and handle contracts
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' && runner.os == 'Windows' }}
        run: python scripts/candidate-test.py windows-process-log cargo test --locked -p codeguard-runtime --test process_windows_contract --test private_log_windows_contract
      - name: Require Windows console cancellation contract
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' && runner.os == 'Windows' }}
        run: python scripts/candidate-test.py windows-console cargo test --locked -p codeguard-runtime --lib interrupt::windows_tests -- --test-threads=1
      - name: Require Windows setup failure contract
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' && runner.os == 'Windows' }}
        run: python scripts/candidate-test.py windows-setup-failure cargo test --locked -p codeguard-runtime --lib process_runner::windows::tests -- --test-threads=1 --nocapture
      - name: Install private candidate and probe real WASM worker
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' && matrix.package }}
        run: python scripts/candidate-test.py package-install node tests/npm_candidate_install.mjs ${{ matrix.binary }}
      - name: Retain evidence without publishing a release
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codeguard-candidate-${{ matrix.target }}-${{ github.sha }}
          path: |
            candidate-evidence/
            release/npm/*.tgz
          if-no-files-found: warn
          retention-days: 7
